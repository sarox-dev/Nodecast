name: Workspace onboarding checks

on:
  pull_request:
    paths: ['app/**', 'tests/**', 'requirements.txt', '.github/workflows/workspace-onboarding.yml']
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', 'requirements.txt', '.github/workflows/workspace-onboarding.yml']

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODECAST_BROWSER_TESTS_REQUIRED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest playwright==1.65.2
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests
      - name: Frontend regressions and syntax
        run: |
          for test in tests/test_*.js; do node "$test"; done
          for script in app/static/js/*.js; do node --check "$script"; done
