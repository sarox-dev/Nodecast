name: Discord release notification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable major/minor release tag (e.g. v1.8.0)'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/scripts/notify_discord.py'
      - '.github/workflows/discord-release.yml'
      - '.github/workflows/release.yml'
      - 'tests/test_discord_release.py'
  pull_request:
    paths:
      - '.github/scripts/notify_discord.py'
      - '.github/workflows/discord-release.yml'
      - '.github/workflows/release.yml'
      - 'tests/test_discord_release.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && github.event.repository.default_branch || github.ref }}
      - run: python3 -m unittest discover -s tests -p test_discord_release.py

  notify:
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/notify_discord.py
