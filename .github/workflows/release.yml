name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
 release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Bump version.json
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          DATE="$(date -u +%Y-%m-%d)"
          echo "{\"version\": \"${V}\", \"build\": \"${DATE}\"}" > app/version.json
          echo "Bumped version.json to $V ($DATE)"

      - name: Update CHANGELOG.md
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          DATE="$(date -u +%Y-%m-%d)"
          PREV_TAG=$(git tag --sort=-version:refname | grep -vx "$GITHUB_REF_NAME" | head -n1)
          LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" 2>/dev/null || echo "- Initial release")
          HEADER="## v${V} (${DATE})"
          TMP=$(mktemp)
          echo "$HEADER" > "$TMP"
          echo "" >> "$TMP"
          echo "$LOG" >> "$TMP"
          echo "" >> "$TMP"
          echo "" >> "$TMP"
          cat CHANGELOG.md >> "$TMP" 2>/dev/null || true
          mv "$TMP" CHANGELOG.md
          echo "Updated CHANGELOG.md"

      - name: Commit version bump to main
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add app/version.json CHANGELOG.md
          git commit -m "chore: bump version to ${GITHUB_REF_NAME#v}" || echo "Nothing to commit"
          git push origin HEAD:main
          # Move tag to the new commit so release zip includes updated files
          git tag -f "$GITHUB_REF_NAME" HEAD
          git push origin -f "$GITHUB_REF_NAME"

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -vx "$CURRENT_TAG" | head -n1)

          if [ -z "$PREV_TAG" ]; then
            {
              echo "notes<<EOF"
              echo "## What's changed"
              echo
              echo "Initial release."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "notes<<EOF"
              echo "## What's changed since $PREV_TAG"
              echo
              git log "$PREV_TAG..HEAD" --pretty=format:"- %s (%h)"
              echo
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build verified release bundle
        shell: bash
        run: |
          ARCHIVE="nodecast-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix="Nodecast-${GITHUB_REF_NAME}/" -o "$ARCHIVE" HEAD
          sha256sum "$ARCHIVE" install.sh install.ps1 > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nodecast ${{ github.ref_name }}

          body: |
            ${{ steps.notes.outputs.notes }}

            ## Installation

            ### Linux / macOS

            ```bash
            Download `install.sh` and `SHA256SUMS`, verify the checksum, then run the installer.
            ```

            ### Windows (PowerShell)

            ```powershell
            Download `install.ps1` and `SHA256SUMS`, verify the checksum, then run the installer.
            ```

            ## Docker

            ```bash
            git clone https://github.com/sarox-dev/Nodecast.git
            cd Nodecast
            git checkout ${{ github.ref_name }}
            cp .env.example .env
            docker compose up -d
            ```

          files: |
            install.sh
            install.ps1
            nodecast-${{ github.ref_name }}.tar.gz
            SHA256SUMS

          overwrite_files: true
          draft: false
          prerelease: false

      # Releases created with GITHUB_TOKEN do not trigger release workflows.
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/notify_discord.py
