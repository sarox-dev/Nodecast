name: Security regression checks
on:
  push:
    branches: ["main", "security/lan-compatible-hardening"]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q
      - run: node tests/test_inline_citations.js
      - run: node tests/test_result_groups.js
      - run: node tests/test_synthesis_stream.js
      - run: node tests/test_workspace_query.js
      - if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
          python -m pytest tests/test_browser_security.py -q
      - if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          bash -n scripts/update-nodecast.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1', 'scripts/install-updater.ps1', 'scripts/update-nodecast.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }

          & ./tests/test_installer_public_origin.ps1
