<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nodecast — Recovery codes</title><link rel="stylesheet" href="/static/css/base.css"><link rel="stylesheet" href="/static/css/theme-default.css"><style>
body{min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--bg);color:var(--text)}.card{width:min(720px,100%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px}.eyebrow{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em}h1{font-size:24px;margin:8px 0}p{color:var(--text-dim);line-height:1.55}.codes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:24px 0;padding:18px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font:600 14px ui-monospace,monospace}.actions{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 14px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text);cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:transparent}button:disabled{opacity:.45;cursor:not-allowed}.confirm{display:flex;gap:10px;align-items:center;margin:20px 0;font-size:14px}@media(max-width:560px){.codes{grid-template-columns:1fr}.card{padding:22px}}@media print{.actions,.confirm,#continue{display:none}.card{border:0}.codes{font-size:16px}}
</style></head><body><main class="card"><span class="eyebrow">Owner security</span><h1>Save your recovery codes</h1><p>Each code can recover the owner account once. Store the downloaded file somewhere separate from this Nodecast installation. These codes cannot be shown again.</p><div id="codes" class="codes" aria-live="polite">Generating a new set…</div><div class="actions"><button id="download">Download .txt</button><button id="copy">Copy all</button><button onclick="window.print()">Print</button></div><label class="confirm"><input id="saved" type="checkbox"> I saved these recovery codes somewhere safe</label><button id="continue" class="primary" disabled>Continue to administration</button><p id="status"></p></main><script>
let codes=[],handled=false;const box=document.getElementById('codes'),status=document.getElementById('status');
async function load(){const r=await fetch('/auth/recovery/setup-codes',{method:'POST'});const d=await r.json();if(!r.ok){status.textContent=d.detail||'Could not create recovery codes';return}codes=d.codes;box.innerHTML=codes.map(c=>`<span>${c}</span>`).join('')}
function mark(){handled=true;document.getElementById('continue').disabled=!document.getElementById('saved').checked}
document.getElementById('download').onclick=()=>{const blob=new Blob([`Nodecast owner recovery codes\nGenerated: ${new Date().toISOString()}\n\n${codes.join('\n')}\n`],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nodecast-recovery-codes.txt';a.click();URL.revokeObjectURL(a.href);mark()};
document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(codes.join('\n'));mark();status.textContent='Copied.'};document.getElementById('saved').onchange=e=>document.getElementById('continue').disabled=!(handled&&e.target.checked);
document.getElementById('continue').onclick=async()=>{const r=await fetch('/auth/recovery/setup-acknowledge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({saved:true})});if(r.ok)location.href='/admin';else status.textContent=(await r.json()).detail||'Could not finish setup'};load();
</script></body></html>
