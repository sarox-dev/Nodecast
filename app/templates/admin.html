<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration · Nodecast</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/theme-default.css">
  <link rel="stylesheet" href="/static/css/theme-light.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-width:320px; background:var(--bg); color:var(--text); font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif; }
    button,input,select { font:inherit; }
    button { border:1px solid var(--border); border-radius:7px; padding:8px 11px; background:transparent; color:var(--text); cursor:pointer; }
    button:hover { border-color:var(--text-dim); background:var(--surface-hover); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button.danger { color:#e97b7b; }
    input,select { min-height:36px; border:1px solid var(--border); border-radius:7px; padding:7px 9px; color:var(--text); background:var(--bg); }
    input:focus,select:focus,button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .shell { min-height:100vh; display:grid; grid-template-columns:210px minmax(0,1fr); }
    aside { display:flex; flex-direction:column; padding:22px 12px 14px; border-right:1px solid var(--border); }
    .brand { display:flex; align-items:center; gap:9px; padding:0 9px 22px; color:var(--text); font-weight:650; letter-spacing:-.01em; }
    .brand img { width:24px; height:24px; object-fit:contain; }
    .nav { display:grid; gap:2px; }
    .nav button { width:100%; display:flex; align-items:center; gap:9px; border:0; border-radius:6px; padding:8px 9px; color:var(--text-dim); text-align:left; }
    .nav button::before { width:14px; text-align:center; color:currentColor; font-size:13px; content:'·'; }
    .nav button.active { color:var(--text); background:var(--surface); }
    .account { margin-top:auto; padding:14px 9px 0; border-top:1px solid var(--border); color:var(--text-dim); font-size:12px; }
    .account strong { color:var(--text); font-weight:600; }
    .account a { color:var(--text-dim); }
    main { width:min(1160px,100%); padding:38px clamp(24px,5vw,68px) 60px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-bottom:28px; }
    h1 { margin:0; font-size:22px; letter-spacing:-.025em; font-weight:650; }
    h2,h3 { margin:0; font-size:14px; letter-spacing:-.01em; }
    .role { border:1px solid var(--border); border-radius:99px; padding:3px 8px; color:var(--text-dim); font-size:12px; text-transform:capitalize; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .metric,.panel { border:1px solid var(--border); border-radius:9px; background:var(--surface); }
    .metric { padding:16px; }.metric b { display:block; margin-top:8px; font-size:25px; letter-spacing:-.04em; }
    .panel { margin-top:12px; padding:16px; }
    .head,.row { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .head { margin-bottom:13px; }.head > div { min-width:0; }
    .muted { color:var(--text-dim); font-size:12px; }.stack { display:grid; gap:3px; }
    .list { border:1px solid var(--border); border-radius:8px; overflow:hidden; }.row { padding:11px 12px; border-bottom:1px solid var(--border); }.row:last-child { border:0; }
    .actions,.form { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }.form input { min-width:150px; }
    .provider { display:grid; grid-template-columns:40px minmax(0,1fr) auto; align-items:center; gap:12px; }
    .provider-icon { display:grid; place-items:center; width:40px; height:40px; border:1px solid var(--border); border-radius:8px; color:var(--text-dim); font-weight:700; }
    .provider-name { font-weight:620; }.provider-meta { margin-top:2px; color:var(--text-dim); font-size:12px; }
    .assignment { align-items:flex-start; }.assignment > div:first-child { min-width:170px; }.assignment .controls { justify-content:flex-end; }.assignment select { min-width:155px; }
    .policy { display:flex; gap:7px; flex-wrap:wrap; }.policy button.active { border-color:var(--accent); color:var(--text); background:color-mix(in srgb,var(--accent) 13%,transparent); }
    .notice { margin-top:12px; padding:10px 12px; border:1px solid var(--border); border-radius:7px; color:var(--text-dim); font-size:12px; }
    #toast { position:fixed; z-index:20; right:20px; bottom:20px; max-width:min(390px,calc(100vw - 40px)); padding:10px 13px; border:1px solid var(--border); border-radius:8px; background:var(--surface); box-shadow:0 12px 32px #0004; transform:translateY(110px); transition:transform .2s ease; }
    #toast.show { transform:translateY(0); } #toast.error { border-color:#ad5252; color:#ffb3b3; }
    dialog { width:min(520px,calc(100vw - 32px)); border:1px solid var(--border); border-radius:10px; padding:0; background:var(--surface); color:var(--text); box-shadow:0 18px 70px #0008; }
    dialog::backdrop { background:#0009; } .dialog-body { padding:20px; }.dialog-body h2 { font-size:17px; margin-bottom:6px; }.dialog-body p { color:var(--text-dim); margin:0 0 16px; }.dialog-body .form { display:grid; }.dialog-actions { display:flex; justify-content:flex-end; gap:7px; margin-top:17px; }
    .codes { white-space:pre-wrap; margin-top:12px; padding:12px; border-radius:7px; background:var(--bg); font:600 12px/1.6 ui-monospace,SFMono-Regular,monospace; }
    @media(max-width:760px) { .shell { grid-template-columns:1fr; }.shell aside { padding:12px; border-right:0; border-bottom:1px solid var(--border); }.brand { padding-bottom:10px; }.nav { display:flex; overflow:auto; }.nav button { width:auto; white-space:nowrap; }.account { display:none; } main { padding:24px 16px 48px; }.grid { grid-template-columns:1fr; }.provider { grid-template-columns:36px minmax(0,1fr); }.provider .actions { grid-column:1/-1; }.assignment { align-items:flex-start; flex-direction:column; }.assignment .controls { justify-content:flex-start; width:100%; } }
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><img src="/static/logo.png" alt="">Nodecast <span class="muted">Admin</span></div>
    <nav class="nav">
      <button class="active" data-view="overview">Overview</button>
      {% if can_manage_members %}<button data-view="accounts">Accounts</button>{% endif %}
      {% if can_manage_resets %}<button data-view="resets">Password requests</button>{% endif %}
      <button data-view="sessions">Sessions</button>
      {% if user.role == 'owner' %}<button data-view="security">Security</button>{% endif %}
      {% if can_ai_policy %}<button data-view="ai">AI</button>{% endif %}
      {% if user.role == 'owner' %}<button data-view="audit">Audit log</button>{% endif %}
    </nav>
    <div class="account"><strong>{{ username }}</strong><br><span>{{ user.role }}</span> · <a href="#" id="logout">Log out</a></div>
  </aside>
  <main><header><h1 id="title">Overview</h1><span class="role">{{ user.role }}</span></header><div id="content"></div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><div class="dialog-body" id="modal-body"></div></dialog>
<script>
const role={{ user.role|tojson }}, canAiPolicy={{ can_ai_policy|tojson }};
const content=document.querySelector('#content'), modal=document.querySelector('#modal'), modalBody=document.querySelector('#modal-body');
const state={providers:[],assignments:[],features:[],catalogs:new Map(),policy:null};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=t=>t?new Date(t*1000).toLocaleString():'—';
let toastTimer; function toast(message,error=false){const n=document.querySelector('#toast');n.textContent=message;n.className='show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.className='',4200)}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),'Content-Type':opt.body?'application/json':(opt.headers||{})['Content-Type']}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Request failed');return d}
function closeModal(){modal.close();modalBody.innerHTML=''} function openModal(html){modalBody.innerHTML=html;modal.showModal();modal.querySelector('[data-close]')?.addEventListener('click',closeModal)}
function passwordPrompt(title,description,callback){openModal(`<h2>${esc(title)}</h2><p>${esc(description)}</p><form id="password-form" class="form"><input name="current_password" type="password" autocomplete="current-password" placeholder="Current administrator password" required><div class="dialog-actions"><button type="button" data-close>Cancel</button><button class="primary">Continue</button></div></form>`);modal.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await callback(new FormData(e.target).get('current_password'));closeModal()}catch(err){toast(err.message,true)}}}
async function overview(){const d=await api('/api/admin/overview');content.innerHTML=`<div class="grid"><div class="metric"><span class="muted">Accounts</span><b>${d.users}</b></div><div class="metric"><span class="muted">Pending resets</span><b>${d.pending_resets}</b></div><div class="metric"><span class="muted">Active sessions</span><b>${d.active_sessions}</b></div></div>${role==='owner'?`<section class="panel"><div class="head"><div class="stack"><h2>Public registration</h2><span class="muted">New public accounts are always members.</span></div><label><input id="registration" type="checkbox" ${d.open_registration?'checked':''}> Enabled</label></div></section>`:''}`;document.querySelector('#registration')?.addEventListener('change',async e=>{try{await api('/auth/settings/registration?open_registration='+e.target.checked,{method:'POST'});toast('Registration setting saved.')}catch(err){e.target.checked=!e.target.checked;toast(err.message,true)}})}
async function accounts(){const d=await api('/api/admin/users');content.innerHTML=`<section class="panel"><div class="head"><h2>Create account</h2></div><form class="form" id="create-account"><input name="username" placeholder="Username" required><input name="password" type="password" minlength="12" placeholder="Temporary password" required><select name="role"><option value="member">Member</option>${role==='owner'?'<option value="moderator">Moderator</option>':''}</select><button class="primary">Create account</button></form></section><section class="panel"><div class="head"><h2>Accounts</h2><span class="muted">Passwords can only be reset through an approved request.</span></div><div class="list">${d.users.map(u=>`<div class="row"><div class="stack"><strong>${esc(u.username)}</strong><span class="muted">${esc(u.role)} · ${u.disabled?'disabled':'active'}${u.ai_policy_override?' · '+esc(u.ai_policy_override.replaceAll('_',' ')):''}</span></div>${u.role!=='owner'?`<div class="actions">${role==='owner'&&u.role==='member'?`<select data-user-policy="${u.id}" aria-label="AI policy for ${esc(u.username)}"><option value="" ${!u.ai_policy_override?'selected':''}>Inherit AI policy</option><option value="locked_shared" ${u.ai_policy_override==='locked_shared'?'selected':''}>Locked shared</option><option value="default_with_override" ${u.ai_policy_override==='default_with_override'?'selected':''}>Default + override</option><option value="user_managed" ${u.ai_policy_override==='user_managed'?'selected':''}>User managed</option></select>`:''}${role==='owner'&&u.role==='moderator'?`<button data-permissions="${u.id}" data-current="${esc((u.permissions||[]).join(','))}">Permissions</button>`:''}<button data-user-action="${u.disabled?'enable':'disable'}" data-id="${u.id}">${u.disabled?'Enable':'Disable'}</button>${role==='owner'?`<button data-user-action="set_role" data-role="${u.role==='moderator'?'member':'moderator'}" data-id="${u.id}">${u.role==='moderator'?'Make member':'Make moderator'}</button>`:''}<button class="danger" data-user-action="delete" data-id="${u.id}">Delete</button></div>`:''}</div>`).join('')}</div></section>`;
document.querySelector('#create-account').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/users',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('Account created.');accounts()}catch(err){toast(err.message,true)}};
content.querySelectorAll('[data-user-action]').forEach(b=>b.onclick=()=>{const action=b.dataset.userAction;if(action==='delete'){openModal(`<h2>Delete account?</h2><p>This permanently removes the account and its Library data.</p><div class="dialog-actions"><button data-close>Cancel</button><button class="danger" id="confirm-delete">Delete account</button></div>`);modal.querySelector('#confirm-delete').onclick=()=>{closeModal();passwordPrompt('Confirm account deletion','Enter your owner password to permanently delete this account.',pw=>api(`/api/admin/users/${b.dataset.id}/action`,{method:'POST',body:JSON.stringify({action,current_password:pw})}).then(()=>{toast('Account deleted.');accounts()}))};return} passwordPrompt('Confirm account change','Enter your administrator password to apply this change.',pw=>api(`/api/admin/users/${b.dataset.id}/action`,{method:'POST',body:JSON.stringify({action,current_password:pw,role:b.dataset.role||null})}).then(()=>{toast('Account updated.');accounts()}))});content.querySelectorAll('[data-user-policy]').forEach(select=>select.onchange=()=>passwordPrompt('Confirm AI policy override','Enter your owner password to change this member\'s AI policy.',pw=>api(`/api/admin/users/${select.dataset.userPolicy}/ai-policy`,{method:'PUT',body:JSON.stringify({mode:select.value||null,current_password:pw})}).then(()=>{toast('Member AI policy updated.');accounts()})));content.querySelectorAll('[data-permissions]').forEach(button=>button.onclick=()=>{const current=new Set((button.dataset.current||'').split(',').filter(Boolean));openModal(`<h2>Moderator permissions</h2><p>Choose the administrative actions this moderator can perform.</p><form id="permissions-form" class="form">${['manage_members','manage_member_resets','manage_ai_policy'].map(p=>`<label><input type="checkbox" name="permission" value="${p}" ${current.has(p)?'checked':''}> ${p.replaceAll('_',' ')}</label>`).join('')}<div class="dialog-actions"><button type="button" data-close>Cancel</button><button class="primary">Save permissions</button></div></form>`);modal.querySelector('form').onsubmit=e=>{e.preventDefault();const permissions=[...new FormData(e.target).getAll('permission')];closeModal();passwordPrompt('Confirm moderator permissions','Enter your owner password to apply these permissions.',pw=>api(`/api/admin/users/${button.dataset.permissions}/permissions`,{method:'PUT',body:JSON.stringify({permissions,current_password:pw})}).then(()=>{toast('Moderator permissions updated.');accounts()}))}})}
async function resets(){const d=await api('/api/admin/reset-requests');content.innerHTML=`<section class="panel"><div class="head"><h2>Pending password requests</h2></div><div class="list">${d.requests.length?d.requests.map(r=>`<div class="row"><div class="stack"><strong>${esc(r.username)}</strong><span class="muted">${fmt(r.created_at)} · ${esc(r.user_agent||'Unknown device')}</span></div><div class="actions"><button class="primary" data-reset="approve" data-id="${r.id}">Approve</button><button data-reset="reject" data-id="${r.id}">Reject</button></div></div>`).join(''):'<div class="row muted">No pending requests.</div>'}</div></section>`;content.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>passwordPrompt(`${b.dataset.reset==='approve'?'Approve':'Reject'} password request`,'This is a security-sensitive action.',pw=>api(`/api/admin/reset-requests/${b.dataset.id}`,{method:'POST',body:JSON.stringify({decision:b.dataset.reset,current_password:pw})}).then(()=>{toast('Password request updated.');resets()})))}
async function sessions(){const d=await api('/auth/sessions');content.innerHTML=`<section class="panel"><div class="head"><div class="stack"><h2>Your sessions</h2><span class="muted">End sessions you no longer recognise.</span></div><button id="logout-others">Log out other sessions</button></div><div class="list">${d.sessions.map(s=>`<div class="row"><div class="stack"><strong>${s.current?'This browser':'Browser session'}</strong><span class="muted">Last active ${fmt(s.last_seen_at)} · ${esc(s.user_agent||'Unknown device')}</span></div><button data-session="${s.id}">Log out</button></div>`).join('')}</div></section>`;document.querySelector('#logout-others').onclick=async()=>{await api('/auth/sessions',{method:'DELETE'});toast('Other sessions were logged out.');sessions()};content.querySelectorAll('[data-session]').forEach(b=>b.onclick=async()=>{const d=await api('/auth/sessions/'+b.dataset.session,{method:'DELETE'});d.current?location.href='/login':sessions()})}
async function security(){const d=await api('/auth/recovery/status');content.innerHTML=`<section class="panel"><div class="head"><div class="stack"><h2>Owner recovery codes</h2><span class="muted">${d.remaining} of ${d.total} unused · generated ${fmt(d.created_at)}</span></div><button id="rotate">Generate new codes</button></div><div class="notice">A new set invalidates every previous owner recovery code immediately.</div><div id="codes"></div></section>`;document.querySelector('#rotate').onclick=()=>passwordPrompt('Generate new recovery codes','Your old recovery codes will stop working immediately.',async pw=>{const d=await api('/auth/recovery/rotate',{method:'POST',body:JSON.stringify({current_password:pw})});document.querySelector('#codes').innerHTML=`<div class="codes">Save these codes now. They will not be shown again.\n\n${esc(d.codes.join('\n'))}</div><div class="actions" style="margin-top:8px"><button id="copy-codes">Copy all</button><button id="download-codes">Download .txt</button></div>`;document.querySelector('#copy-codes').onclick=()=>navigator.clipboard.writeText(d.codes.join('\n')).then(()=>toast('Recovery codes copied.'));document.querySelector('#download-codes').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['Nodecast owner recovery codes\n\n'+d.codes.join('\n')+'\n'],{type:'text/plain'}));a.download='nodecast-recovery-codes.txt';a.click();URL.revokeObjectURL(a.href)};toast('New recovery codes generated.')})}
async function loadAI(){const [p,a,f,policy]=await Promise.all([api('/api/ai/providers'),api('/api/ai/assignments'),api('/api/ai/features'),api('/api/admin/ai-policy')]);state.providers=p.providers||[];state.assignments=a.assignments||[];state.features=f.features||[];state.policy=policy;await Promise.all(state.providers.map(async provider=>{try{const x=await api('/api/ai/providers/'+provider.id+'/models');state.catalogs.set(provider.id,x.models||[])}catch{state.catalogs.set(provider.id,[])}}))}
function providerOptions(selected=''){return `<option value="">Choose provider…</option>${state.providers.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('')}`}
function modelOptions(providerId,selected=''){const models=state.catalogs.get(providerId)||[];const exists=models.some(m=>(m.id||m)===selected);return `<option value="">Choose model…</option>${selected&&!exists?`<option value="${esc(selected)}" selected>${esc(selected)} (saved)</option>`:''}${models.map(m=>{const id=m.id||m;const label=m.name||id;return `<option value="${esc(id)}" ${id===selected?'selected':''}>${esc(label)}</option>`}).join('')}`}
function assignmentRows(){return state.features.map(f=>{const a=state.assignments.find(x=>x.feature===f.id)||{};return `<form class="row assignment" data-feature="${esc(f.id)}"><div class="stack"><strong>${esc(f.name)}</strong><span class="muted">${esc(f.description)}</span></div><div class="controls form"><select name="provider_id" aria-label="Provider for ${esc(f.name)}">${providerOptions(a.provider_id)}</select><select name="model" aria-label="Model for ${esc(f.name)}">${modelOptions(a.provider_id,a.model||'')}</select><button>Save</button></div></form>`}).join('')}
function bindAssignmentForms(){content.querySelectorAll('.assignment').forEach(form=>{const provider=form.elements.provider_id,model=form.elements.model;provider.onchange=()=>model.innerHTML=modelOptions(provider.value,'');form.onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(form));if(!body.provider_id||!body.model)return toast('Choose both a provider and a model.',true);try{await api('/api/ai/assignments',{method:'POST',body:JSON.stringify({...body,feature:form.dataset.feature})});toast('Feature assignment saved.');await loadAI();const parent=form.parentElement;parent.innerHTML=assignmentRows();bindAssignmentForms()}catch(err){toast(err.message,true)}}})}
async function providerDialog(existing=null){const presets=(await api('/api/ai/provider-presets')).presets||[];const isEdit=!!existing;openModal(`<h2>${isEdit?'Edit provider':'Add shared provider'}</h2><p>${isEdit?'Change the name or endpoint. Existing credentials remain unless replaced.':'The shared provider is used according to the member policy below.'}</p><form id="provider-form" class="form"><select name="preset" ${isEdit?'disabled':''}>${presets.filter(p=>!p.oauth).map(p=>`<option value="${esc(p.key)}" ${(existing?.provider_key||'openai')===p.key?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input name="name" value="${esc(existing?.name||'')}" placeholder="Provider name" required><input name="base_url" value="${esc(existing?.base_url||'')}" placeholder="API base URL" required><input name="api_key" type="password" placeholder="${isEdit?'New API key (optional)':'API key'}"><span class="muted" id="preset-help"></span><div class="dialog-actions"><button type="button" data-close>Cancel</button><button type="button" id="test-provider">Test connection</button><button class="primary">${isEdit?'Save provider':'Add provider'}</button></div></form>`);
const form=modal.querySelector('#provider-form'), preset=form.elements.preset, help=modal.querySelector('#preset-help');function syncPreset(){const p=presets.find(x=>x.key===preset.value);if(!p)return;help.textContent=p.requires_api_key?'An API key is required for this provider.':'An API key is optional for this provider.';if(!isEdit){form.elements.name.value=p.name||'';form.elements.base_url.value=p.default_base_url||'';form.elements.api_key.required=Boolean(p.requires_api_key)}}syncPreset();preset.onchange=syncPreset;modal.querySelector('#test-provider').onclick=async()=>{try{const p=presets.find(x=>x.key===preset.value)||{};const data=Object.fromEntries(new FormData(form));await api('/api/ai/providers/test-connection',{method:'POST',body:JSON.stringify({name:data.name||'test',base_url:data.base_url,api_key:data.api_key||'',provider_key:p.key,api_style:p.api_style||'openai'})});toast('Connection succeeded.')}catch(err){toast(err.message,true)}};form.onsubmit=async e=>{e.preventDefault();try{const p=presets.find(x=>x.key===preset.value)||{};const data=Object.fromEntries(new FormData(form));const body={name:data.name,base_url:data.base_url,api_key:data.api_key||'',provider_key:p.key,api_style:p.api_style||'openai'};if(isEdit)await api('/api/ai/providers/'+existing.id,{method:'PUT',body:JSON.stringify(body)});else await api('/api/ai/providers',{method:'POST',body:JSON.stringify({...body,provider_type:'openai_compatible'})});closeModal();toast(isEdit?'Provider saved.':'Provider added.');ai()}catch(err){toast(err.message,true)}}}
async function ai(){await loadAI();const locked=state.policy?.mode==='locked_shared';content.innerHTML=`<section class="panel"><div class="head"><div class="stack"><h2>Shared AI providers</h2><span class="muted">Credentials stay on this installation. Model choices come directly from each provider.</span></div><div class="actions"><button id="connect-chatgpt">Connect ChatGPT</button><button class="primary" id="add-provider">Add provider</button></div></div><div class="list">${state.providers.length?state.providers.map(p=>{const models=state.catalogs.get(p.id)||[];return `<div class="row provider"><div class="provider-icon">${esc((p.name||'?')[0].toUpperCase())}</div><div><div class="provider-name">${esc(p.name)}</div><div class="provider-meta">${p.status==='connected'?'Connected':'Status unavailable'} · ${models.length?models.length+' models available':'No model catalog available'}</div></div><div class="actions"><button data-edit-provider="${p.id}">Edit</button><button class="danger" data-delete-provider="${p.id}">Delete</button></div></div>`}).join(''):'<div class="row muted">No shared providers yet. Add one to configure shared model assignments.</div>'}</div></section><section class="panel"><div class="head"><div class="stack"><h2>Feature assignments</h2><span class="muted">Each feature receives a provider and a selectable model.</span></div></div>${state.providers.length?`<div class="form" style="margin-bottom:12px"><select id="bulk-provider">${providerOptions('')}</select><select id="bulk-model"><option value="">Choose model…</option></select><button id="apply-all">Apply to all features</button></div>`:''}<div class="list" id="assignment-list">${assignmentRows()}</div></section><section class="panel"><div class="head"><div class="stack"><h2>Member AI policy</h2><span class="muted">${locked?'All member features use the shared assignments.':'Choose how members can use or override shared AI providers.'}</span></div></div><div class="policy"><button data-policy="user_managed" class="${state.policy?.mode==='user_managed'?'active':''}">User managed</button><button data-policy="default_with_override" class="${state.policy?.mode==='default_with_override'?'active':''}">Default + override</button><button data-policy="locked_shared" class="${locked?'active':''}">Locked shared</button></div></section>`;
bindAssignmentForms();document.querySelector('#add-provider').onclick=()=>providerDialog();document.querySelector('#connect-chatgpt').onclick=async()=>{try{const d=await api('/api/ai/chatgpt/start',{method:'POST'});window.open(d.authorization_url,'nodecast-oauth','width=560,height=720')}catch(err){toast(err.message,true)}};content.querySelectorAll('[data-edit-provider]').forEach(b=>b.onclick=()=>providerDialog(state.providers.find(p=>p.id===b.dataset.editProvider)));content.querySelectorAll('[data-delete-provider]').forEach(b=>b.onclick=()=>{openModal(`<h2>Delete provider?</h2><p>Assignments that use it must be configured again.</p><div class="dialog-actions"><button data-close>Cancel</button><button class="danger" id="delete-provider">Delete provider</button></div>`);modal.querySelector('#delete-provider').onclick=async()=>{try{await api('/api/ai/providers/'+b.dataset.deleteProvider,{method:'DELETE'});closeModal();toast('Provider deleted.');ai()}catch(err){toast(err.message,true)}}});const bulkProvider=document.querySelector('#bulk-provider'),bulkModel=document.querySelector('#bulk-model');if(bulkProvider){bulkProvider.onchange=()=>bulkModel.innerHTML=modelOptions(bulkProvider.value,'');document.querySelector('#apply-all').onclick=async()=>{if(!bulkProvider.value||!bulkModel.value)return toast('Choose a provider and a model.',true);try{await Promise.all(state.features.map(f=>api('/api/ai/assignments',{method:'POST',body:JSON.stringify({feature:f.id,provider_id:bulkProvider.value,model:bulkModel.value})})));toast('Applied to all features.');ai()}catch(err){toast(err.message,true)}}}content.querySelectorAll('[data-policy]').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/ai-policy',{method:'PUT',body:JSON.stringify({mode:b.dataset.policy,exceptions:{}})});toast('Member AI policy saved.');ai()}catch(err){toast(err.message,true)}})}
async function audit(){const d=await api('/api/admin/audit');content.innerHTML=`<section class="panel"><div class="head"><h2>Security audit log</h2></div><div class="list">${d.events.length?d.events.map(e=>`<div class="row"><div class="stack"><strong>${esc(e.event_type.replaceAll('_',' '))}</strong><span class="muted">${fmt(e.created_at)} · ${esc(e.actor||'system')} → ${esc(e.target||'installation')}</span></div></div>`).join(''):'<div class="row muted">No security events yet.</div>'}</div></section>`}
const views={overview,accounts,resets,sessions,security,ai,audit};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#title').textContent=b.textContent;views[b.dataset.view]().catch(e=>toast(e.message,true))});document.querySelector('#logout').onclick=async e=>{e.preventDefault();await fetch('/auth/logout',{method:'POST'});location.href='/login'};overview().catch(e=>toast(e.message,true));
</script>
</body>
</html>
