<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nodecast Administration</title><link rel="stylesheet" href="/static/css/base.css"><link rel="stylesheet" href="/static/css/theme-default.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid var(--border);padding:24px 14px}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 22px;font-weight:650}.brand img{width:28px;height:28px}.nav{display:grid;gap:3px}.nav button{border:0;background:none;color:var(--text-dim);text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--surface);color:var(--text)}.side-foot{position:fixed;bottom:22px;width:185px;padding:0 10px;font-size:12px;color:var(--text-dim)}main{padding:40px clamp(24px,5vw,72px);max-width:1200px;width:100%}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:23px;margin:0}h2{font-size:14px;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric,.panel{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:16px}.metric strong{display:block;font-size:24px;margin-top:8px}.panel{margin-top:14px}.panel-head,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head{margin-bottom:14px}.list{border:1px solid var(--border);border-radius:7px;overflow:hidden}.row{padding:12px;border-bottom:1px solid var(--border)}.row:last-child{border:0}.muted{color:var(--text-dim);font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}button,input,select{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;padding:9px 10px}button{cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:transparent}.danger{color:#ef7878}.form{display:flex;gap:8px;flex-wrap:wrap}.form input{min-width:160px}.hidden{display:none!important}.codes{white-space:pre-wrap;font:600 13px ui-monospace,monospace;background:var(--bg);padding:14px;border-radius:7px;margin-top:12px}.status{font-size:13px;color:var(--text-dim);min-height:20px}.badge{font-size:11px;padding:3px 7px;border:1px solid var(--border);border-radius:99px}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--border)}.nav{display:flex;overflow:auto}.side-foot{position:static;margin-top:15px}.grid{grid-template-columns:1fr}main{padding:24px 16px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><img src="/static/logo.png" alt="">Nodecast Admin</div><nav class="nav"><button data-view="overview" class="active">Overview</button>{% if can_manage_members %}<button data-view="accounts">Accounts</button>{% endif %}{% if can_manage_resets %}<button data-view="resets">Password requests</button>{% endif %}<button data-view="sessions">Sessions</button>{% if user.role == 'owner' %}<button data-view="security">Security</button>{% endif %}{% if can_ai_policy %}<button data-view="ai">AI policy</button>{% endif %}{% if user.role == 'owner' %}<button data-view="audit">Audit log</button>{% endif %}</nav><div class="side-foot"><strong>{{ username }}</strong><br>{{ user.role }} · <a href="#" id="logout">Log out</a></div></aside><main><header><h1 id="title">Overview</h1><span class="badge">{{ user.role }}</span></header><div id="content"></div><p id="status" class="status"></p></main></div><script>
const role={{ user.role|tojson }},canAiPolicy={{ can_ai_policy|tojson }},content=document.getElementById('content'),status=document.getElementById('status');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Request failed');return d}function fmt(ts){return ts?new Date(ts*1000).toLocaleString():'—'}
async function overview(){const d=await api('/api/admin/overview');content.innerHTML=`<div class="grid"><div class="metric"><span class="muted">Accounts</span><strong>${d.users}</strong></div><div class="metric"><span class="muted">Pending resets</span><strong>${d.pending_resets}</strong></div><div class="metric"><span class="muted">Active sessions</span><strong>${d.active_sessions}</strong></div></div>${role==='owner'?`<section class="panel"><div class="panel-head"><div><h2>Public registration</h2><span class="muted">When enabled, new accounts register as members.</span></div><input id="registration" type="checkbox" ${d.open_registration?'checked':''}></div></section>`:''}`;document.getElementById('registration')?.addEventListener('change',e=>api('/auth/settings/registration?open_registration='+e.target.checked,{method:'POST'}))}
async function accounts(){const d=await api('/api/admin/users');content.innerHTML=`<section class="panel"><div class="panel-head"><h2>Create account</h2></div><form id="create" class="form"><input name="username" placeholder="Username" required><input name="password" type="password" minlength="12" placeholder="Temporary password" required><select name="role"><option value="member">Member</option>${role==='owner'?'<option value="moderator">Moderator</option>':''}</select><button class="primary">Create</button></form></section><section class="panel"><div class="panel-head"><h2>Accounts</h2></div><div class="list">${d.users.map(u=>`<div class="row"><span><strong>${esc(u.username)}</strong><br><span class="muted">${esc(u.role)} · ${u.disabled?'disabled':'active'}${u.permissions?' · '+u.permissions.map(p=>p.replace('manage_','')).join(', '):''}</span></span><span class="actions">${u.role!=='owner'?`${u.role==='member'&&role==='owner'?`<select data-ai-user="${u.id}" aria-label="AI policy for ${esc(u.username)}"><option value="" ${!u.ai_policy_override?'selected':''}>Inherit AI policy</option><option value="locked_shared" ${u.ai_policy_override==='locked_shared'?'selected':''}>Locked shared</option><option value="default_with_override" ${u.ai_policy_override==='default_with_override'?'selected':''}>Default + override</option><option value="user_managed" ${u.ai_policy_override==='user_managed'?'selected':''}>User managed</option></select>`:''}${u.role==='moderator'&&role==='owner'?`<button data-permissions="${u.id}" data-current="${esc((u.permissions||[]).join(','))}">Permissions</button>`:''}<button data-action="${u.disabled?'enable':'disable'}" data-id="${u.id}">${u.disabled?'Enable':'Disable'}</button>${role==='owner'?`<button data-action="set_role" data-role="${u.role==='moderator'?'member':'moderator'}" data-id="${u.id}">${u.role==='moderator'?'Make member':'Make moderator'}</button>`:''}<button class="danger" data-action="delete" data-id="${u.id}">Delete</button>`:''}</span></div>`).join('')}</div></section>`;document.getElementById('create').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});accounts()};content.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{if(b.dataset.action==='delete'&&!confirm('Delete this account and all of its data?'))return;const pw=prompt('Enter your administrator password');if(!pw)return;await api(`/api/admin/users/${b.dataset.id}/action`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:b.dataset.action,current_password:pw,role:b.dataset.role||null})});accounts()});content.querySelectorAll('[data-permissions]').forEach(b=>b.onclick=async()=>{const answer=prompt('Allowed: manage_members, manage_member_resets, manage_ai_policy',b.dataset.current);if(answer===null)return;const permissions=answer.split(',').map(x=>x.trim()).filter(Boolean),current_password=prompt('Enter your owner password');if(!current_password)return;await api(`/api/admin/users/${b.dataset.permissions}/permissions`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({permissions,current_password})});accounts()});content.querySelectorAll('[data-ai-user]').forEach(select=>select.onchange=async()=>{const current_password=prompt('Enter your owner password');if(!current_password){accounts();return}await api(`/api/admin/users/${select.dataset.aiUser}/ai-policy`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:select.value||null,current_password})});status.textContent='Account AI policy updated.'})}
async function resets(){const d=await api('/api/admin/reset-requests');content.innerHTML=`<section class="panel"><div class="panel-head"><h2>Pending password requests</h2></div><div class="list">${d.requests.length?d.requests.map(r=>`<div class="row"><span><strong>${esc(r.username)}</strong><br><span class="muted">${esc(r.role)} · ${fmt(r.created_at)} · ${esc(r.user_agent||'Unknown device')}</span></span><span class="actions"><button class="primary" data-decision="approve" data-id="${r.id}">Approve</button><button data-decision="reject" data-id="${r.id}">Reject</button></span></div>`).join(''):'<div class="row muted">No pending requests.</div>'}</div></section>`;content.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{const pw=prompt('Enter your administrator password');if(!pw)return;await api(`/api/admin/reset-requests/${b.dataset.id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:b.dataset.decision,current_password:pw})});resets()})}
async function sessions(){const d=await api('/auth/sessions');content.innerHTML=`<section class="panel"><div class="panel-head"><h2>Your sessions</h2><button id="logout-others">Log out other sessions</button></div><div class="list">${d.sessions.map(s=>`<div class="row"><span><strong>${s.current?'This browser':'Browser session'}</strong><br><span class="muted">Last active ${fmt(s.last_seen_at)} · ${esc(s.user_agent||'Unknown device')}</span></span><button data-session="${s.id}">Log out</button></div>`).join('')}</div></section>`;document.getElementById('logout-others').onclick=async()=>{await api('/auth/sessions',{method:'DELETE'});sessions()};content.querySelectorAll('[data-session]').forEach(b=>b.onclick=async()=>{const d=await api('/auth/sessions/'+b.dataset.session,{method:'DELETE'});d.current?location.href='/login':sessions()})}
async function security(){const d=await api('/auth/recovery/status');content.innerHTML=`<section class="panel"><div class="panel-head"><span><h2>Owner recovery codes</h2><span class="muted">${d.remaining} of ${d.total} codes available · created ${fmt(d.created_at)}</span></span><button id="rotate">Generate new codes</button></div><div id="codes" class="codes hidden"></div><div id="recovery-actions" class="actions hidden"><button id="download-recovery">Download .txt</button><button id="copy-recovery">Copy all</button></div></section>`;document.getElementById('rotate').onclick=async()=>{if(!confirm('The previous recovery codes will stop working. Continue?'))return;const current_password=prompt('Enter your current owner password');if(!current_password)return;const d=await api('/auth/recovery/rotate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password})});const box=document.getElementById('codes'),actions=document.getElementById('recovery-actions');box.classList.remove('hidden');actions.classList.remove('hidden');box.textContent='Save this set now. It cannot be shown again.\n\n'+d.codes.join('\n');document.getElementById('copy-recovery').onclick=()=>navigator.clipboard.writeText(d.codes.join('\n'));document.getElementById('download-recovery').onclick=()=>{const blob=new Blob(['Nodecast owner recovery codes\n\n'+d.codes.join('\n')+'\n'],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nodecast-recovery-codes.txt';a.click();URL.revokeObjectURL(a.href)}}}
async function ai(){const policy=await api('/api/admin/ai-policy');if(role!=='owner'){content.innerHTML=`<section class="panel"><div class="panel-head"><span><h2>Member AI policy</h2><span class="muted">The owner granted this moderator permission to change the active policy.</span></span></div><form id="policy" class="form"><select name="mode"><option value="user_managed" ${policy.mode==='user_managed'?'selected':''}>User managed</option><option value="default_with_override" ${policy.mode==='default_with_override'?'selected':''}>Default with override</option><option value="locked_shared" ${policy.mode==='locked_shared'?'selected':''}>Locked shared provider</option></select><button class="primary">Save policy</button></form></section>`;document.getElementById('policy').onsubmit=async e=>{e.preventDefault();await api('/api/admin/ai-policy',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:new FormData(e.target).get('mode'),exceptions:{}})});status.textContent='AI policy saved.'};return}const [providers,assignments,features]=await Promise.all([api('/api/ai/providers'),api('/api/ai/assignments'),api('/api/ai/features')]);content.innerHTML=`<section class="panel"><div class="panel-head"><span><h2>Shared AI providers</h2><span class="muted">Provider secrets remain server-side.</span></span><button id="chatgpt">Connect ChatGPT</button></div><form id="provider" class="form"><input name="name" placeholder="Provider name" required><input name="base_url" placeholder="https://…/v1" required><input name="api_key" type="password" placeholder="API key"><button class="primary">Add provider</button></form><div class="list" style="margin-top:12px">${providers.providers.map(p=>`<div class="row"><span><strong>${esc(p.name)}</strong><br><span class="muted">${esc(p.provider_key||p.provider_type)}</span></span><button class="danger" data-provider-delete="${p.id}">Delete</button></div>`).join('')||'<div class="row muted">No shared provider configured.</div>'}</div></section><section class="panel"><div class="panel-head"><h2>Feature assignments</h2></div><div class="list">${features.features.map(f=>{const a=assignments.assignments.find(x=>x.feature===f.id)||{};return `<form class="row assignment" data-feature="${f.id}"><span><strong>${esc(f.name)}</strong><br><span class="muted">${esc(f.description)}</span></span><span class="form"><select name="provider_id"><option value="">Provider…</option>${providers.providers.map(p=>`<option value="${p.id}" ${a.provider_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input name="model" value="${esc(a.model||'')}" placeholder="Model ID"><button>Save</button></span></form>`}).join('')}</div></section><section class="panel"><div class="panel-head"><span><h2>Member AI policy</h2><span class="muted">Shared modes require every feature assignment above.</span></span></div><form id="policy" class="form"><select name="mode"><option value="user_managed" ${policy.mode==='user_managed'?'selected':''}>User managed</option><option value="default_with_override" ${policy.mode==='default_with_override'?'selected':''}>Default with override</option><option value="locked_shared" ${policy.mode==='locked_shared'?'selected':''}>Locked shared provider</option></select><button class="primary">Save policy</button></form></section>`;document.getElementById('provider').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));body.provider_type='openai_compatible';body.provider_key='custom';body.api_style='openai';await api('/api/ai/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});ai()};document.getElementById('chatgpt').onclick=async()=>{const d=await api('/api/ai/chatgpt/start',{method:'POST'});open(d.authorization_url,'nodecast-oauth','width=560,height=720')};content.querySelectorAll('[data-provider-delete]').forEach(b=>b.onclick=async()=>{await api('/api/ai/providers/'+b.dataset.providerDelete,{method:'DELETE'});ai()});content.querySelectorAll('.assignment').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(form));body.feature=form.dataset.feature;if(!body.provider_id||!body.model){status.textContent='Choose a provider and enter a model ID.';return}await api('/api/ai/assignments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});status.textContent='Feature assignment saved.'});document.getElementById('policy').onsubmit=async e=>{e.preventDefault();await api('/api/admin/ai-policy',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:new FormData(e.target).get('mode'),exceptions:{}})});status.textContent='AI policy saved.'}}
async function audit(){const d=await api('/api/admin/audit');content.innerHTML=`<section class="panel"><div class="panel-head"><h2>Security audit log</h2></div><div class="list">${d.events.map(e=>`<div class="row"><span><strong>${esc(e.event_type.replaceAll('_',' '))}</strong><br><span class="muted">${fmt(e.created_at)} · ${esc(e.actor||'system')} → ${esc(e.target||'installation')}</span></span></div>`).join('')}</div></section>`}
const views={overview,accounts,resets,sessions,security,ai,audit};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('title').textContent=b.textContent;status.textContent='';views[b.dataset.view]().catch(e=>status.textContent=e.message)});document.getElementById('logout').onclick=async e=>{e.preventDefault();await fetch('/auth/logout',{method:'POST'});location.href='/login'};overview().catch(e=>status.textContent=e.message);
</script></body></html>
