<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nodecast — Account recovery</title><link rel="stylesheet" href="/static/css/base.css"><link rel="stylesheet" href="/static/css/theme-default.css"><style>
body{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px}h1{font-size:22px;margin:0 0 8px}p{color:var(--text-dim);line-height:1.5}.tabs{display:flex;border-bottom:1px solid var(--border);margin:20px 0}.tabs button{flex:1;border:0;border-bottom:2px solid transparent;background:none;color:var(--text-dim);padding:10px}.tabs button.active{color:var(--text);border-color:var(--accent)}form{display:grid;gap:12px}input,button{padding:11px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text)}button{cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:transparent}.hidden{display:none}.codes{font:600 13px ui-monospace,monospace;white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:7px}.status{min-height:20px;font-size:13px;color:var(--text-dim)}a{color:var(--accent)}
</style></head><body><main class="card"><h1>Recover access</h1><p>Members request administrator approval. The installation owner uses a saved recovery code.</p><div class="tabs"><button class="active" data-tab="member">Member</button><button data-tab="owner">Owner</button></div><section id="member"><form id="member-request"><input id="member-name" autocomplete="username" placeholder="Username" required><button class="primary">Request password reset</button></form><div id="member-wait" class="hidden"><p>Waiting for an administrator to approve this request…</p><button id="check">Check again</button></div><form id="member-reset" class="hidden"><input id="member-password" type="password" minlength="12" autocomplete="new-password" placeholder="New password" required><button class="primary">Set new password</button></form></section><section id="owner" class="hidden"><form id="owner-check"><input id="owner-name" autocomplete="username" placeholder="Owner username" required><input id="owner-code" autocomplete="one-time-code" placeholder="NC-… recovery code" required><button class="primary">Verify recovery code</button></form><form id="owner-reset" class="hidden"><input id="owner-password" type="password" minlength="16" autocomplete="new-password" placeholder="New owner password" required><button class="primary">Reset password</button></form><div id="new-codes" class="codes hidden"></div><div id="code-actions" class="hidden"><button id="download-codes">Download .txt</button><button id="copy-codes">Copy all</button></div></section><p id="status" class="status"></p><a href="/login">Back to sign in</a></main><script>
let newCodes=[];const status=document.getElementById('status');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('member').classList.toggle('hidden',b.dataset.tab!=='member');document.getElementById('owner').classList.toggle('hidden',b.dataset.tab!=='owner')});async function send(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');return d}
document.getElementById('member-request').onsubmit=async e=>{e.preventDefault();try{const d=await send('/auth/recovery/request',{username:document.getElementById('member-name').value});status.textContent=d.message;e.target.classList.add('hidden');document.getElementById('member-wait').classList.remove('hidden')}catch(x){status.textContent=x.message}};
async function check(){const r=await fetch('/auth/recovery/request-status'),d=await r.json();status.textContent=`Reset request: ${d.status}`;if(d.status==='approved'){document.getElementById('member-wait').classList.add('hidden');document.getElementById('member-reset').classList.remove('hidden')}}document.getElementById('check').onclick=check;
document.getElementById('member-reset').onsubmit=async e=>{e.preventDefault();try{await send('/auth/recovery/member-reset',{new_password:document.getElementById('member-password').value});location.href='/login'}catch(x){status.textContent=x.message}};
document.getElementById('owner-check').onsubmit=async e=>{e.preventDefault();try{await send('/auth/recovery/owner-challenge',{username:document.getElementById('owner-name').value,recovery_code:document.getElementById('owner-code').value});e.target.classList.add('hidden');document.getElementById('owner-reset').classList.remove('hidden');status.textContent='Recovery code accepted. Choose a new password.'}catch(x){status.textContent=x.message}};
document.getElementById('owner-reset').onsubmit=async e=>{e.preventDefault();try{const d=await send('/auth/recovery/owner-reset',{new_password:document.getElementById('owner-password').value});newCodes=d.codes;const box=document.getElementById('new-codes');box.classList.remove('hidden');document.getElementById('code-actions').classList.remove('hidden');box.textContent='Save this new recovery set now:\n\n'+newCodes.join('\n');e.target.classList.add('hidden');status.innerHTML='Old sessions and codes were revoked. Save these codes, then <a href="/login">sign in</a>.'}catch(x){status.textContent=x.message}};document.getElementById('download-codes').onclick=()=>{const blob=new Blob(['Nodecast owner recovery codes\n\n'+newCodes.join('\n')+'\n'],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nodecast-recovery-codes.txt';a.click();URL.revokeObjectURL(a.href)};document.getElementById('copy-codes').onclick=()=>navigator.clipboard.writeText(newCodes.join('\n'));
</script></body></html>
