<div id="settings-overlay" class="settings-overlay" hidden aria-hidden="true">
  <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-header">
      <div class="settings-header-left">
        <span class="settings-kicker">Nodecast workspace</span>
        <h2 id="settings-title">Settings</h2>
      </div>
      <div class="settings-header-meta">
        <button id="settings-close" class="settings-close" type="button" aria-label="Close settings">&times;</button>
      </div>
    </div>
    <div class="settings-body">
      <aside class="settings-sidebar">
        <div class="settings-search-wrap">
          <span aria-hidden="true">⌕</span>
          <label class="sr-only" for="settings-search-input">Search settings</label>
          <input id="settings-search-input" class="settings-search" type="search" placeholder="Find a setting…" autocomplete="off" />
        </div>
        <p class="settings-nav-label">Preferences</p>
        <nav class="settings-category-nav" aria-label="Settings categories">
          <ul id="settings-categories" class="settings-category-list"></ul>
        </nav>
      </aside>
      <section class="settings-main">
        <div class="settings-section-header">
          <div>
            <span class="settings-section-kicker">Configuration</span>
            <h3 id="settings-category-title">Search</h3>
            <p id="settings-category-description" class="settings-category-description">Choose which search engines to use and add a custom search provider.</p>
          </div>
        </div>
        <div id="settings-list" class="settings-list"></div>
      </section>
    </div>
    <div class="settings-actions" id="settings-actions-bar">
      <div class="settings-change-state" id="settings-change-state" aria-live="polite">
        <span class="settings-change-dot"></span>
        <span id="settings-change-copy">No unsaved changes</span>
      </div>
      <div class="settings-action-buttons">
        <button id="settings-revert" type="button" disabled>Discard</button>
        <button id="settings-save" type="button" disabled>Save changes</button>
      </div>
    </div>
  </div>
</div>
