services:
  app:
    container_name: nodecast-app
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NODECAST_BIND_HOST:-127.0.0.1}:${APP_PORT}:${APP_PORT}"
    volumes:
      # :Z grants this container write access on SELinux hosts (Fedora/RHEL)
      # while keeping the rest of the container filesystem read-only.
      - ./contents:/app/contents:Z
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    user: "${NODECAST_UID:-1000}:${NODECAST_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      - APP_HOST=${APP_HOST}
      - APP_PORT=${APP_PORT}
      - AUTO_UPDATE_DEFAULT=${AUTO_UPDATE_DEFAULT:-false}
      - NODECAST_INSTALL_MODE=docker
      - PYTHONDONTWRITEBYTECODE=1
