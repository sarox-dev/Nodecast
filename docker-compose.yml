services:
  app:
    container_name: nodecast-app
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ./app:/app/app
      - ./contents:/app/contents
      - ./.env:/app/.env
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${APP_PORT:-5000} --reload"
    environment:
      - APP_HOST=${APP_HOST}
      - APP_PORT=${APP_PORT}