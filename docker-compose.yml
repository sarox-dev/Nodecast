services:
  app:
    container_name: nodecast-app
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    volumes:
      - ./contents:/app/contents
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      - APP_HOST=${APP_HOST}
      - APP_PORT=${APP_PORT}
      - AUTO_UPDATE_DEFAULT=${AUTO_UPDATE_DEFAULT:-false}
      - NODECAST_INSTALL_MODE=docker
      - PYTHONDONTWRITEBYTECODE=1
